<!DOCTYPE html>
<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Las miniaturas son
     archivos locales (file:) y el QR llega como data:. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:;">
<title>Umbral</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/umbral.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0a0a0a;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f0f3f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el arco primero, la rendija de luz detrás.
     Es el mismo trazo que el ícono `arch` de app.js: si divergen, el arranque
     pega un salto cuando el splash le pasa la posta a la titlebar. */
  #boot-splash path { stroke-dasharray: 30; stroke-dashoffset: 30;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke-dasharray: 7; stroke-dashoffset: 7;
                                 opacity: .34; animation-delay: .1s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <path d="M3.67 13.67v-6a4.33 4.33 0 0 1 8.66 0v6"/>
    <path d="M8 7.33v6.34"/>
  </svg>
</div>

<div class="op-app ub-app">

  <!-- El sustrato: la niebla que el vidrio difumina. Una capa, estática. -->
  <div class="op-fog" aria-hidden="true"></div>

  <!-- ── Titlebar propia: aire sobre la niebla, sin frame nativo ─────────── -->
  <header class="op-titlebar">
    <div class="op-brand op-no-drag" id="brand">
      <svg class="op-brand__mark op-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.67 13.67v-6a4.33 4.33 0 0 1 8.66 0v6"/>
        <path class="op-brand__trail" d="M8 7.33v6.34"/>
      </svg>
      <span class="op-brand__name">Umbral</span>
    </div>
  </header>

  <div class="op-wincontrols">
    <button class="op-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
    <button class="op-wincontrol op-iconswap" id="win-max" aria-label="Maximizar"><i data-icon="winMax"></i><i data-icon="winRestore"></i></button>
    <button class="op-wincontrol op-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
  </div>

  <div class="op-body">

    <!-- ── Rail: los dos lados del umbral y el Notepad ───────────────────── -->
    <nav class="op-rail">
      <div class="op-rail__nav op-scroll">
        <div class="op-rail__group">
          <!-- Los contadores nacen vacíos: el primer dato no es un cambio. -->
          <button class="op-navitem" data-view="recibidas" data-tip="Lo que llegó del celu" data-tip-key="Ctrl+1" data-tip-side="right">
            <i data-icon="inbox"></i> Recibidas <span class="op-navitem__count" id="n-in"></span>
          </button>
          <button class="op-navitem" data-view="celu" data-tip="Lo que espera para bajar al celu" data-tip-key="Ctrl+2" data-tip-side="right">
            <i data-icon="phoneDown"></i> Para el celu <span class="op-navitem__count ub-count" id="n-out"></span>
          </button>
          <button class="op-navitem" data-view="notepad" data-tip="El texto que comparten la PC, el celu y CC" data-tip-key="Ctrl+3" data-tip-side="right">
            <i data-icon="notepad"></i> Notepad
          </button>
        </div>
      </div>

      <!-- Vincular el celu: el QR para el navegador y el código para la app. -->
      <div class="op-rail__foot ub-rail-foot">
        <button class="op-btn op-btn--secondary op-btn--sm op-flashable ub-vincular" id="btn-qr">
          <i data-icon="qr"></i> Vincular el celu
        </button>
      </div>
    </nav>

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="op-main" id="view"></main>
  </div>

  <!-- ── Statusbar: dónde escucha Umbral ──────────────────────────────────── -->
  <footer class="op-statusbar">
    <div class="op-statusbar__item ub-server">
      <span id="srv-mark"></span>
      <span class="op-statusbar__value op-mono op-copyable" id="addr"></span>
    </div>
    <div class="op-spacer"></div>
    <div class="op-statusbar__item" data-tip="Trae Umbral desde cualquier lado" data-tip-side="top">
      <span class="op-kbd">Ctrl</span><span class="op-kbd">Shift</span><span class="op-kbd">U</span>
    </div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="op-layer"></div>
<input id="file-pick" type="file" multiple hidden>

<script type="module" src="./js/app.js"></script>
