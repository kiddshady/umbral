<!DOCTYPE html>
<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Las miniaturas son
     archivos locales (file:) y el QR llega como data:. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:;">
<title>Umbral</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/umbral.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0b0a0f;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #9d7bff; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el arco primero, la rendija de luz detrás.
     Es el mismo trazo que el ícono `arch` de app.js: si divergen, el arranque
     pega un salto cuando el splash le pasa la posta a la titlebar. */
  #boot-splash path { stroke-dasharray: 30; stroke-dashoffset: 30;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke-dasharray: 7; stroke-dashoffset: 7;
                                 opacity: .34; animation-delay: .1s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <path d="M3.67 13.67v-6a4.33 4.33 0 0 1 8.66 0v6"/>
    <path d="M8 7.33v6.34"/>
  </svg>
</div>

<div class="ox-app ub-app">

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="ox-brand ox-no-drag" id="brand">
      <svg class="ox-brand__mark ox-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.67 13.67v-6a4.33 4.33 0 0 1 8.66 0v6"/>
        <path class="ox-brand__trail" d="M8 7.33v6.34"/>
      </svg>
      <span class="ox-brand__name">Umbral</span>
    </div>

    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <!-- ── La barra: qué lado del umbral, dónde escucha, y las herramientas ── -->
  <div class="ub-bar">
    <!-- Los contadores nacen vacíos: el primer dato no es un cambio. -->
    <div class="ox-segmented" id="seg">
      <button class="ox-segmented__opt is-active" data-value="recibidas">Recibidas <span class="ub-count" id="n-in"></span></button>
      <button class="ox-segmented__opt" data-value="celu">Para el celu <span class="ub-count" id="n-out"></span></button>
    </div>

    <span class="ox-vr ub-bar__sep"></span>

    <div class="ub-server">
      <span id="srv-mark"></span>
      <span class="ub-addr ox-mono ox-copyable" id="addr"></span>
      <button class="ox-iconbtn" id="btn-qr" data-tip="QR para el teléfono" data-tip-side="bottom"><i data-icon="qr"></i></button>
    </div>

    <div class="ox-spacer"></div>

    <!-- Solo en «Para el celu»: se pliega a lo ancho con `hidden`. -->
    <div class="ub-bar__group ox-plegable--ancho" id="out-tools" hidden>
      <button class="ox-iconbtn" id="btn-add" data-tip="Agregar archivos" data-tip-side="bottom"><i data-icon="plus"></i></button>
      <button class="ox-iconbtn" id="btn-sweep" data-tip="Quitar las ya bajadas" data-tip-side="bottom"><i data-icon="sweep"></i></button>
    </div>

    <div class="ub-size" data-tip="Tamaño de las miniaturas" data-tip-side="bottom">
      <i data-icon="sizeSm"></i>
      <input type="range" class="ox-slider" id="thumb-size" min="150" max="420" step="10" aria-label="Tamaño de las miniaturas">
      <i data-icon="sizeLg"></i>
    </div>

    <div class="ub-bar__group">
      <button class="ox-iconbtn" id="btn-folder" data-tip="Abrir la carpeta" data-tip-side="bottom"><i data-icon="folder"></i></button>
      <button class="ox-iconbtn ub-nuke" id="btn-nuke" data-tip="Purgar todo" data-tip-side="bottom"><i data-icon="nuke"></i></button>
    </div>
  </div>

  <div class="ox-body">
    <main class="ox-main" id="view"></main>
  </div>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>
<input id="file-pick" type="file" multiple hidden>

<script type="module" src="./js/app.js"></script>
